<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderVibes - Travel Discovery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            color: #333;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            /* Animated swaying pastel gradient */
            background: linear-gradient(120deg, #f8e1ff, #ffe7d1, #d1f7ff, #f9f6e7);
            background-size: 400% 400%;
            animation: sway-gradient 18s ease-in-out infinite;
        }

        @keyframes sway-gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Navigation */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 20px;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .nav-tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-tab:hover {
            background: #e8f4fd;
            color: #3498db;
        }

        .nav-tab.active {
            background: #3498db;
            color: white;
        }

        /* Content Sections */
        .content-section {
            display: none;
            animation: fadeIn 0.5s ease;
            min-height: calc(100vh - 200px);
            padding-bottom: 40px;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login/Signup */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .auth-toggle {
            display: flex;
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }

        .auth-toggle button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .auth-toggle button.active {
            background: #3498db;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-google {
            background: #fff;
            color: #333;
            border: 2px solid #e1e8ed;
        }

        .btn-google:hover {
            background: #f8f9fa;
        }

        /* Search */
        .search-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 16px 24px;
            border: 2px solid #e1e8ed;
            border-radius: 25px;
            font-size: 18px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .search-btn {
            padding: 16px 32px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .map-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .map-frame {
            width: 100%;
            height: 300px;
            border: none;
            border-radius: 10px;
        }

        /* Destination Cards */
        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
            width: 100%;
            max-width: 100%;
            overflow: visible;
        }

        .destination-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .destination-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .destination-card:hover .card-image img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tag {
            background: #e8f4fd;
            color: #3498db;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }

        .card-description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .favorite-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .favorite-btn:hover {
            background: #c0392b;
        }

        .favorite-btn.favorited {
            background: #27ae60;
        }

        /* Profile */
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .profile-email {
            color: #666;
            margin-bottom: 20px;
        }

        .profile-form {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .favorites-section {
            margin-top: 30px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
            }

            .destinations-grid {
                grid-template-columns: 1fr;
            }

            .auth-container {
                margin: 20px auto;
                padding: 30px 20px;
            }
        }

        /* Hidden file input */
        #profile-pic-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo">🌍 WanderVibes</div>
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="showSection('explore')">Explore</button>
                <button class="nav-tab" onclick="showSection('search')">Search</button>
                <button class="nav-tab" onclick="showSection('profile')">Profile</button>
                <button class="nav-tab" onclick="showSection('auth')">Login</button>
            </div>
        </nav>

        <!-- Explore Section -->
        <div id="explore" class="content-section active">
            <h1 class="section-title">Discover Amazing Destinations</h1>
            <div class="destinations-grid" id="explore-grid">
                <!-- Destination cards will be populated by JavaScript -->
            </div>
        </div>

        <!-- Search Section -->
        <div id="search" class="content-section">
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="Search for destinations (e.g., Hawaii, Paris, Tokyo)">
                <button class="search-btn" onclick="searchDestination()">Search</button>
            </div>
            <div id="search-results"></div>
        </div>

        <!-- Profile Section -->
        <div id="profile" class="content-section">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-pic" onclick="document.getElementById('profile-pic-input').click()">
                        <span id="profile-initial">U</span>
                        <img id="profile-pic-img" style="display: none;">
                    </div>
                    <input type="file" id="profile-pic-input" accept="image/*" onchange="handleProfilePicUpload(event)">
                    <div class="profile-name" id="profile-name">User</div>
                    <div class="profile-email" id="profile-email">user@example.com</div>
                </div>

                <div class="profile-form">
                    <h2 class="section-title">Edit Profile</h2>
                    <div class="form-group">
                        <label for="edit-name">Name</label>
                        <input type="text" id="edit-name" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="edit-interests">Interests</label>
                        <input type="text" id="edit-interests" placeholder="e.g., Beach, Mountains, City Life">
                    </div>
                    <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
                </div>

                <div class="favorites-section">
                    <h2 class="section-title">My Favorites</h2>
                    <div class="destinations-grid" id="favorites-grid">
                        <!-- Favorites will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Auth Section -->
        <div id="auth" class="content-section">
            <div class="auth-container">
                <div class="auth-toggle">
                    <button class="auth-toggle-btn active" onclick="toggleAuth('login')">Login</button>
                    <button class="auth-toggle-btn" onclick="toggleAuth('signup')">Sign Up</button>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                    <button type="button" class="btn btn-google">Sign in with Google</button>
                </form>

                <form id="signup-form" style="display: none;">
                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Account</button>
                    <button type="button" class="btn btn-google">Sign up with Google</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Sample destination data
        const destinations = [
            {
                id: 1,
                name: "Hawaii",
                image: "https://images.unsplash.com/photo-1598135753163-6167c1a1ad65?w=800&auto=format&fit=crop",
                tags: ["#beachlife", "#tropical", "#paradise"],
                description: "Sunny tropical beaches with palm trees and crystal clear turquoise waters.",
                mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d238132.0979576659!2d-157.977066!3d21.306944!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7c00183b8cc3464d%3A0x4b28f55ff3a7976c!2sHawaii%2C%20USA!5e0!3m2!1sen!2sus!4v1234567890"
            },
            {
                id: 2,
                name: "New York",
                image: "https://images.unsplash.com/photo-1522083165195-3424ed129620?w=800&auto=format&fit=crop",
                tags: ["#cityvibes", "#urban", "#culture"],
                description: "The city that never sleeps with iconic skyline and endless energy.",
                mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d193595.25436351647!2d-74.11976404999999!3d40.6976634!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c24fa5d33f083b%3A0xc80b8f06e177fe62!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sus!4v1234567890"
            },
            {
                id: 3,
                name: "Paris",
                image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=800&auto=format&fit=crop",
                tags: ["#romance", "#culture", "#art"],
                description: "The city of love with the iconic Eiffel Tower and charming streets.",
                mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d83998.9549114659!2d2.2769952!3d48.8589507!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66e1f06e2b70f%3A0x40b82c3688c9460!2sParis%2C%20France!5e0!3m2!1sen!2sus!4v1234567890"
            },
            {
                id: 4,
                name: "Tokyo",
                image: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=800&auto=format&fit=crop",
                tags: ["#technology", "#culture", "#food"],
                description: "Neon-lit cityscape with cherry blossoms and cutting-edge technology.",
                mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d207446.825306!2d139.600784!3d35.6762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188b857628235d%3A0xcdd8aef709a2b520!2sTokyo%2C%20Japan!5e0!3m2!1sen!2sus!4v1234567890"
            },
            {
                id: 5,
                name: "Iceland",
                image: "https://images.unsplash.com/photo-1504893524553-b855bce32c67?w=800&auto=format&fit=crop",
                tags: ["#nature", "#adventure", "#northernlights"],
                description: "Land of fire and ice with glaciers, mountains, and northern lights.",
                mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d173575.825306!2d-21.942236!3d64.9631!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x48d22b52a3eb3023%3A0x6f7a682bca20d6f5!2sIceland!5e0!3m2!1sen!2sus!4v1234567890"
            },
            {
                id: 6,
                name: "Bali",
                image: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=800&auto=format&fit=crop",
                tags: ["#spiritual", "#beach", "#culture"],
                description: "Tropical paradise with spiritual temples and pristine beaches.",
                mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126915.0676!2d115.188916!3d-8.3405!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2dd22f7520fca7d3%3A0x2872b62cc456cd84!2sBali%2C%20Indonesia!5e0!3m2!1sen!2sus!4v1234567890"
            }
        ];

        // Initialize app
        let currentUser = null;
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        let userProfile = JSON.parse(localStorage.getItem('userProfile') || '{}');

        // Navigation
        function showSection(sectionId) {
            // Hide all sections
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Show selected section
            document.getElementById(sectionId).classList.add('active');
            
            // Update active tab
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Load section-specific content
            if (sectionId === 'explore') {
                loadExploreDestinations();
            } else if (sectionId === 'profile') {
                loadProfile();
                loadFavorites();
            }
        }

        // Auth functions
        function toggleAuth(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const toggleBtns = document.querySelectorAll('.auth-toggle-btn');
            
            toggleBtns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (type === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }

        // Handle form submissions
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            // Mock login - in real app, this would validate against backend
            currentUser = { email, name: email.split('@')[0] };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            alert('Login successful! Welcome back!');
            showSection('explore');
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            // Mock signup
            currentUser = { email, name };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            alert('Account created successfully! Welcome to WanderVibes!');
            showSection('explore');
        });

        // Search functionality
        // Unsplash API (official) - used to fetch images for search results
        const UNSPLASH_ACCESS_KEY = 'rzLFCRQSEqAPRN0qyUhtZAmiL29lS_K3cy7s5XEx3NI';
        async function fetchUnsplashImage(query) {
            try {
                const url = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&orientation=landscape&per_page=1&content_filter=high&client_id=${UNSPLASH_ACCESS_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                const first = data && data.results && data.results[0];
                return (first && (first.urls?.regular || first.urls?.small || first.urls?.thumb)) || '';
            } catch (e) {
                console.error('Unsplash fetch error:', e);
                return '';
            }
        }

        function searchDestination() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const resultsContainer = document.getElementById('search-results');
            
            if (!query.trim()) {
                resultsContainer.innerHTML = '<p style="text-align: center; color: #666;">Enter a destination to search</p>';
                return;
            }

            // Show loading state
            resultsContainer.innerHTML = '<p style="text-align: center; color: #666;">Searching...</p>';

            // Call webhook
            fetch('https://rzhang26.app.n8n.cloud/webhook/WandrAI', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Webhook response:', data);
                let results = [];
                // Handle the actual response format
                if (Array.isArray(data) && data.length > 0 && Array.isArray(data[0].output)) {
                    results = data[0].output;
                } else if (Array.isArray(data)) {
                    results = data;
                } else if (typeof data === 'object' && data !== null) {
                    results = [data];
                }
                if (results.length > 0) {
                    // Ensure tags is always an array
                    results = results.map(dest => {
                        if (!Array.isArray(dest.tags)) {
                            if (typeof dest.tags === 'string') {
                                dest.tags = [dest.tags];
                            } else if (dest.tags && typeof dest.tags === 'object') {
                                dest.tags = Object.values(dest.tags);
                            } else {
                                dest.tags = [];
                            }
                        }
                        return dest;
                    });

                    // Enrich each destination with an Unsplash image based on its name
                    resultsContainer.innerHTML = '<p style="text-align: center; color: #666;">Fetching images...</p>';
                    Promise.all(
                        results.map(async (dest) => {
                            const imageFromUnsplash = await fetchUnsplashImage(dest.name || 'travel');
                            return { ...dest, image: imageFromUnsplash }; // override webhook image
                        })
                    ).then((enriched) => {
                        const first = enriched[0];

        // Create destination card HTML
        function createDestinationCard(destination) {
            const id = destination.id;
            const name = destination.name || 'Unknown';
            const image = destination.image;
            const tags = Array.isArray(destination.tags) ? destination.tags : [];
            const description = destination.description || '';
            const isFavorited = favorites.includes(id);
            const fallbackImage = `https://via.placeholder.com/800x600/e2e8f0/2d3748?text=${encodeURIComponent(name)}`;
            return `
                <div class="destination-card">
                    <div class="card-image">
                        <img 
                            src="${image ? image : fallbackImage}" 
                            alt="${name}" 
                            loading="lazy"
                            onerror="this.onerror=null; this.src='${fallbackImage}';">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${name}</h3>
                        <div class="card-tags">
                            ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <p class="card-description">${description}</p>
                        <button class="favorite-btn ${isFavorited ? 'favorited' : ''}" 
                                onclick="toggleFavorite('${id}')">
                            ${isFavorited ? '❤️ Favorited' : '🤍 Add to Favorites'}
                        </button>
                    </div>
                </div>
            `;
        }

        // Load explore destinations
        function loadExploreDestinations() {
            const grid = document.getElementById('explore-grid');
            grid.innerHTML = destinations.map(dest => createDestinationCard(dest)).join('');
        }

        // Toggle favorite
        function toggleFavorite(destinationId) {
            // Accept both string and number IDs
            const index = favorites.indexOf(destinationId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(destinationId);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            // Refresh only explore and profile tabs
            if (document.getElementById('explore').classList.contains('active')) {
                loadExploreDestinations();
            }
            if (document.getElementById('profile').classList.contains('active')) {
                loadFavorites();
            }
        }

        // Load profile
        function loadProfile() {
            const savedProfile = JSON.parse(localStorage.getItem('userProfile') || '{}');
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            
            document.getElementById('profile-name').textContent = savedProfile.name || currentUser.name || 'User';
            document.getElementById('profile-email').textContent = currentUser.email || 'user@example.com';
            document.getElementById('edit-name').value = savedProfile.name || currentUser.name || '';
            document.getElementById('edit-interests').value = savedProfile.interests || '';
            
            if (savedProfile.profilePic) {
                document.getElementById('profile-pic-img').src = savedProfile.profilePic;
                document.getElementById('profile-pic-img').style.display = 'block';
                document.getElementById('profile-initial').style.display = 'none';
            }
        }

        // Save profile
        function saveProfile() {
            const name = document.getElementById('edit-name').value;
            const interests = document.getElementById('edit-interests').value;
            
            const profile = {
                name,
                interests,
                profilePic: userProfile.profilePic
            };
            
            localStorage.setItem('userProfile', JSON.stringify(profile));
            userProfile = profile;
            
            loadProfile();
            alert('Profile updated successfully!');
        }

        // Handle profile picture upload
        function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    document.getElementById('profile-pic-img').src = imageUrl;
                    document.getElementById('profile-pic-img').style.display = 'block';
                    document.getElementById('profile-initial').style.display = 'none';
                    
                    userProfile.profilePic = imageUrl;
                    localStorage.setItem('userProfile', JSON.stringify(userProfile));
                };
                reader.readAsDataURL(file);
            }
        }

        // Load favorites
        function loadFavorites() {
            const grid = document.getElementById('favorites-grid');
            const favoriteDestinations = destinations.filter(dest => favorites.includes(dest.id));
            
            if (favoriteDestinations.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1 / -1;">No favorites yet. Explore destinations and add them to your favorites!</p>';
                return;
            }
            
            grid.innerHTML = favoriteDestinations.map(dest => createDestinationCard(dest)).join('');
        }

        // Search on Enter key
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchDestination();
            }
        });

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadExploreDestinations();
            loadProfile();
        });
    </script>
</body>
